[package]
name = "navette-berreman"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
# MSRV floor: edition 2024 (1.85) dominates pyo3/numpy 0.29 (1.83).
# Upstream navette declares none and rides @stable; this documents the
# verified floor instead (local build/tests pinned at rustc 1.98.1).
rust-version = "1.85"

[lib]
name = "_berreman"
crate-type = ["cdylib", "rlib"]

[dependencies]
num-complex = "0.4"
# Upstream Navette engine (crates.io): dispersion kernels (materials) + smatrix
# parity surface. Phase 9 decision: depend, don't port — all kernels incl. the
# KK trio come from here; tensor assembly is ours (src/materials.rs).
navette = "0.7.7"
ndarray = "0.15"

[dependencies.pyo3]
version = "0.29"
features = ["extension-module", "abi3-py312"]
optional = true

[dependencies.numpy]
version = "0.29"
optional = true

[dependencies.rayon]
version = "1"
optional = true

[features]
default = []
python = ["dep:pyo3", "dep:numpy", "dep:rayon"]

# (navette moved to [dependencies] for Phase 9; parity pins in
# tests/navette_parity.rs still serve as the re-audit tripwire on upgrade.)

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
